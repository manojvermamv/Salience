[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salience"
version = "0.1.0"
description = "Durable, provider-neutral content program control plane"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "boto3==1.43.93",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp==2.2.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "a2a-sdk==1.1.2",
  "pydantic==2.12.5",
  "psycopg[binary]==3.3.5",
  "sqlalchemy==2.0.52",
  "temporalio==1.32.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
browser = [
  "playwright==1.62.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
content = "salience.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "browser: requires the locally installed Playwright Chromium runtime",
  "live: requires explicitly configured live network or provider access",
]

[tool.setuptools.packages.find]
where = ["src"]
