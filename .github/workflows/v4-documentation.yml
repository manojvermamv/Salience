name: V4 documentation contract

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify blueprint, evidence, archives and links
        run: |
          python3 docs/v4/test_checks.py
          python3 docs/v4/check.py --self-test
