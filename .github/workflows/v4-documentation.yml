name: V4 documentation contract

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify blueprint, evidence, archives and links
        run: |
          python3 docs/v4/test_checks.py
          python3 docs/v4/check.py --self-test

  p0-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies and isolated browser
        run: |
          python -m pip install -e '.[dev,browser]'
          python -m pip check
          python -m playwright install --with-deps chromium --only-shell
      - name: Verify non-live application contracts
        env:
          SALIENCE_DEPLOYMENT_MODE: fixture
        run: python -m pytest -p no:cacheprovider tests/contracts tests/unit tests/integration tests/e2e tests/evals -m 'not live' -q -rs
